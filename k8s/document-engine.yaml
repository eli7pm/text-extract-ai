apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-engine
spec:
  replicas: 1
  selector:
    matchLabels: { app: document-engine }
  template:
    metadata:
      labels: { app: document-engine }
    spec:
      containers:
        - name: document-engine
          image: pspdfkit/document-engine:1.19.0
          ports:
            - containerPort: 5000
          env:
            - { name: PGHOST, value: postgres }
            - { name: PGPORT, value: "5432" }
            - { name: PGUSER, value: de-user }
            - { name: PGDATABASE, value: document-engine }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: text-extract-secrets, key: postgres-password }
            - name: API_AUTH_TOKEN
              valueFrom:
                secretKeyRef: { name: text-extract-secrets, key: api-auth-token }
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef: { name: text-extract-secrets, key: secret-key-base }
            - { name: JWT_ALGORITHM, value: RS256 }
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef: { name: text-extract-secrets, key: jwt-public-key }
            - { name: DASHBOARD_USERNAME, value: dashboard }
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef: { name: text-extract-secrets, key: dashboard-password }
            # Empty = trial mode (watermarked). Set ACTIVATION_KEY when running k8s/up.sh to license it.
            - name: ACTIVATION_KEY
              valueFrom:
                secretKeyRef: { name: text-extract-secrets, key: activation-key, optional: true }
          readinessProbe:
            httpGet: { path: /healthcheck, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 5
---
# LoadBalancer services are published on localhost by OrbStack: http://localhost:5000
apiVersion: v1
kind: Service
metadata:
  name: document-engine
spec:
  type: LoadBalancer
  selector: { app: document-engine }
  ports:
    - port: 5000
      targetPort: 5000
